    <h1>Poem XII</h1>

    <div class="poem">
      whenever she asks, “do you hate me?”
i can never hate her, not at all.
i caught the mixed feelings she left in secret,
her writings and her beautiful soul made me fall 
the love hate relationship we had i can never forget 
    </div>
